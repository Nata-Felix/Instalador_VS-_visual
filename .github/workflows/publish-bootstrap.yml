name: Publish bootstrap script

on:
  push:
    branches:
      - main
    paths:
      - "install.ps1"
      - ".github/workflows/publish-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload install script to v1.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.3.0 install.ps1 --clobber
